spring:
  application:
    name: core-service-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    hikari:
      maximum-pool-size: 5

  jpa:
    database: H2
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  # Disable security for tests to simplify context load
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: 0

services:
  auth:
    base-url: http://localhost:9999  # dummy, won't be called in unit tests

app:
  jwt:
    secret: test-secret-key-for-jwt-in-tests-1234567890abcdef
    expiration: 3600000

logging:
  level:
    root: WARN
    hospital.coreservice: DEBUG
    org.hibernate: WARN
    org.springframework: WARN
