# ============================================================
# NotificationService — Spring Boot Configuration
# ============================================================

spring:
  application:
    name: notification-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ==================== DATABASE ====================
  datasource:
    url: ${NOTIFICATION_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1522/XEPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${NOTIFICATION_DATASOURCE_USERNAME:notification}
    password: ${NOTIFICATION_DATASOURCE_PASSWORD:notification123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # ==================== JPA ====================
  jpa:
    database: ORACLE
    hibernate:
      ddl-auto: ${NOTIFICATION_JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

  # ==================== JACKSON ====================
  jackson:
    serialization:
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # ==================== CACHE ====================
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

  # ==================== RABBITMQ ====================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        prefetch: 5

# ==================== SERVER ====================
server:
  port: ${SERVER_PORT:8088}

# ==================== SERVICES ====================
services:
  auth:
    base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8281}

# ==================== JWT ====================
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-in-production-0123456789abcdef}

# ==================== SPRING DOCS (OpenAPI/Swagger) ====================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    filter: true
  packages-to-scan: hospital.notificationservice.controller
  paths-to-match: /api/v1/**

# ==================== LOGGING ====================
logging:
  level:
    root: INFO
    hospital.notificationservice: DEBUG
    org.springframework.security: INFO
