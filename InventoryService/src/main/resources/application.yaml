# ============================================================
# InventoryService ? Spring Boot Configuration
# ============================================================

spring:
  application:
    name: inventory-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ==================== DATABASE ====================
  datasource:
    url: ${INVENTORY_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1522/XEPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${INVENTORY_DATASOURCE_USERNAME:inventory}
    password: ${INVENTORY_DATASOURCE_PASSWORD:inventory123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # ==================== JPA ====================
  jpa:
    database: ORACLE
    hibernate:
      ddl-auto: ${INVENTORY_JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

  # ==================== JACKSON ====================
  jackson:
    serialization:
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# ==================== SERVER ====================
server:
  port: ${SERVER_PORT:8084}

# ==================== JWT ====================
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-in-production-0123456789abcdef}

# ==================== SPRING DOCS (OpenAPI/Swagger) ====================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    filter: true
  packages-to-scan: hospital.inventoryservice.controller
  paths-to-match: /api/v1/**

# ==================== LOGGING ====================
logging:
  level:
    root: INFO
    hospital.inventoryservice: DEBUG
    org.springframework.security: INFO