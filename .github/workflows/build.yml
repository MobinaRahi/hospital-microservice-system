name: Build & Test (Maven + Java 17)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build with Maven (compile all modules)
        run: ./mvnw clean compile -B --no-transfer-progress

      - name: Run tests
        run: ./mvnw test -B --no-transfer-progress

      - name: Package (verify build artifacts)
        run: ./mvnw package -DskipTests -B --no-transfer-progress
