name: Build & Test (Maven + Java 17)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build with Maven (compile all modules)
        run: |
          chmod +x AuthService/mvnw CoreService/mvnw ClinicalService/mvnw
          ./AuthService/mvnw clean compile -B --no-transfer-progress -f AuthService/pom.xml
          ./CoreService/mvnw clean compile -B --no-transfer-progress -f CoreService/pom.xml
          ./ClinicalService/mvnw clean compile -B --no-transfer-progress -f ClinicalService/pom.xml

      - name: Run tests
        run: |
          ./AuthService/mvnw test -B --no-transfer-progress -f AuthService/pom.xml
          ./CoreService/mvnw test -B --no-transfer-progress -f CoreService/pom.xml
          ./ClinicalService/mvnw test -B --no-transfer-progress -f ClinicalService/pom.xml

      - name: Package services (skip tests)
        run: |
          ./AuthService/mvnw package -DskipTests -B --no-transfer-progress -f AuthService/pom.xml
          ./CoreService/mvnw package -DskipTests -B --no-transfer-progress -f CoreService/pom.xml
          ./ClinicalService/mvnw package -DskipTests -B --no-transfer-progress -f ClinicalService/pom.xml
