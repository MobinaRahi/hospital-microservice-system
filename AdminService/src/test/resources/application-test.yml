# ============================================================
# AdminService — Test Configuration
# ============================================================

spring:
  application:
    name: admin-service-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database: H2
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  cache:
    type: none

# ==================== SERVER ====================
server:
  port: 0

# ==================== LOGGING ====================
logging:
  level:
    root: WARN
    hospital.adminservice: DEBUG
