# ============================================================
# AdminService — Spring Boot Configuration
# ============================================================

spring:
  application:
    name: admin-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ==================== DATABASE ====================
  datasource:
    url: ${ADMIN_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1522/XEPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${ADMIN_DATASOURCE_USERNAME:admin}
    password: ${ADMIN_DATASOURCE_PASSWORD:admin123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # ==================== JPA ====================
  jpa:
    database: ORACLE
    hibernate:
      ddl-auto: ${ADMIN_JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

  # ==================== JACKSON ====================
  jackson:
    serialization:
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # ==================== CACHE ====================
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

# ==================== SERVER ====================
server:
  port: ${SERVER_PORT:8086}

# ==================== SERVICES ====================
services:
  auth:
    base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8281}
  core:
    base-url: ${CORE_SERVICE_BASE_URL:http://localhost:8082}
  billing:
    base-url: ${BILLING_SERVICE_BASE_URL:http://localhost:8085}

# ==================== JWT ====================
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-in-production-0123456789abcdef}

# ==================== SPRING DOCS (OpenAPI/Swagger) ====================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    filter: true
  packages-to-scan: hospital.adminservice.controller
  paths-to-match: /api/v1/**

# ==================== LOGGING ====================
logging:
  level:
    root: INFO
    hospital.adminservice: DEBUG
    org.springframework.security: INFO
