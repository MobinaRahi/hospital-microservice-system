# ============================================================
# Hospital Microservice System — Docker Compose
#
#   docker compose up --build      → start everything
#   docker compose down            → stop everything
#
# Services:
#   Frontend             → http://localhost:5373
#   API Gateway          → http://localhost:8080
#   AuthService          → http://localhost:8281
#   CoreService          → http://localhost:8382
#   ClinicalService      → http://localhost:8383
#   InventoryService     → http://localhost:8084
#   BillingService       → http://localhost:8085
#   AdminService         → http://localhost:8086
#   LabService           → http://localhost:8087
#   NotificationService  → http://localhost:8088
#   TenantService        → http://localhost:8089
#   SuperAdminService    → http://localhost:8090
#   RabbitMQ Management  → http://localhost:15672 (guest/guest)
#
# Swagger UI:
#   http://localhost:8281/swagger-ui.html
#   http://localhost:8382/swagger-ui.html
#   http://localhost:8383/swagger-ui.html
#   http://localhost:8084/swagger-ui.html
#   http://localhost:8085/swagger-ui.html
#   http://localhost:8086/swagger-ui.html
#   http://localhost:8087/swagger-ui.html
#   http://localhost:8088/swagger-ui.html
#   http://localhost:8089/swagger-ui.html
#   http://localhost:8090/swagger-ui.html
#   http://localhost:8080/swagger-ui.html
#
# Accounts:
#   admin / Admin@123
#   dr.ali / Doctor@123
#   patient.reza / Patient@123
# ============================================================

services:

  # ─────────────────────────────────────────────────────────
  # Oracle Database
  # ────────────────────────────────────────────────────────
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: nova-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      APP_USER: ${APP_USER:-appuser}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?set APP_USER_PASSWORD in .env}
    ports:
      - "1522:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/oracle-init.sql:/container-entrypoint-initdb.d/01-create-users.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s
    networks:
      - nova-net

  # ─────────────────────────────────────────────────────────
  # RabbitMQ (Message Queue for Async Notifications)
  # Management UI: http://localhost:15672 (guest/guest)
  # AMQP Port: 5672
  # ─────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nova-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: on-failure
    networks:
      - nova-net

  # ─────────────────────────────────────────────────────────
  # AuthService (host:8281 → container:8081)
  # ─────────────────────────────────────────────────────────
  auth-service:
    build: ./AuthService
    container_name: nova-auth
    environment:
      SERVER_PORT: 8081
      AUTH_DATASOURCE_URL: jdbc:oracle:thin:@oracle-xe:1521/XEPDB1
      AUTH_DATASOURCE_USERNAME: ${AUTH_DB_USERNAME:-auth}
      AUTH_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      AUTH_JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8281:8081"
    depends_on:
      oracle-xe:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure
    networks:
      - nova-net

  # ─────────────────────────────────────────────────────────
  # CoreService (host:8382 → container:8082)
  # ─────────────────────────────────────────────────────────
  core-service:
    build: ./CoreService
    container_name: nova-core
    environment:
      SERVER_PORT: 8082
      CORE_DATASOURCE_URL: jdbc:oracle:thin:@oracle-xe:1521/XEPDB1
      CORE_DATASOURCE_USERNAME: ${CORE_DB_USERNAME:-core}
      CORE_DATASOURCE_PASSWORD: ${CORE_DB_PASSWORD:?set CORE_DB_PASSWORD in .env}
      CORE_JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8382:8082"
    depends_on:
      oracle-xe:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure
    networks:
      - nova-net

  # ─────────────────────────────────────────────────────────
  # ClinicalService (host:8383 → container:8083)
  # ─────────────────────────────────────────────────────────
  clinical-service:
    build: ./ClinicalService
    container_name: nova-clinical
    environment:
      SERVER_PORT: 8083
      CLINICAL_DATASOURCE_URL: jdbc:oracle:thin:@oracle-xe:1521/XEPDB1
      CLINICAL_DATASOURCE_USERNAME: ${CLINICAL_DB_USERNAME:-clinical}
      CLINICAL_DATASOURCE_PASSWORD: ${CLINICAL_DB_PASSWORD:?set CLINICAL_DB_PASSWORD in .env}
      CLINICAL_JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      CORE_SERVICE_BASE_URL: http://core-service:8082
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8383:8083"
    depends_on:
      oracle-xe:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      core-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure
    networks:
      - nova-net

  # ─────────────────────────────────────────────────────────
  # InventoryService (host:8084 → container:8084)
  # ─────────────────────────────────────────────────────────
  inventory-service:
    build: ./InventoryService
    container_name: nova-inventory
    environment:
      SERVER_PORT: 8084
      INVENTORY_DATASOURCE_URL: jdbc:oracle:thin:@oracle-xe:1521/XEPDB1
      INVENTORY_DATASOURCE_USERNAME: ${INVENTORY_DB_USERNAME:-inventory}
      INVENTORY_DATASOURCE_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in .env}
      INVENTORY_JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8084:8084"
    depends_on:
      oracle-xe:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure
    networks:
      - nova-net

  # ─────────────────────────────────────────────────────────
  # BillingService (host:8085 → container:8085)
  # ─────────────────────────────────────────────────────────
  billing-service:
    build: ./BillingService
    container_name: nova-billing
    environment:
      SERVER_PORT: 8085
      BILLING_DATASOURCE_URL: jdbc:oracle:thin:@oracle-xe:1521/XEPDB1
      BILLING_DATASOURCE_USERNAME: ${BILLING_DB_USERNAME:-billing}
      BILLING_DATASOURCE_PASSWORD: ${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD in .env}
      BILLING_JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      CORE_SERVICE_BASE_URL: http://core-service:8082
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8085:8085"
    depends_on:
      oracle-xe:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure
    networks:
      - nova-net

  # ─────────────────────────────────────────────────────────
  # AdminService (host:8086 → container:8086)
  # ─────────────────────────────────────────────────────────
  admin-service:
    build: ./AdminService
    container_name: nova-admin
    environment:
      SERVER_PORT: 8086
      ADMIN_DATASOURCE_URL: jdbc:oracle:thin:@oracle-xe:1521/XEPDB1
      ADMIN_DATASOURCE_USERNAME: ${ADMIN_DB_USERNAME:-admin}
      ADMIN_DATASOURCE_PASSWORD: ${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD in .env}
      ADMIN_JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      CORE_SERVICE_BASE_URL: http://core-service:8082
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8086:8086"
    depends_on:
      oracle-xe:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure
    networks:
      - nova-net

  # ─────────────────────────────────────────────────────────
  # LabService (host:8087 → container:8087)
  # ─────────────────────────────────────────────────────────
  lab-service:
    build: ./LabService
    container_name: nova-lab
    environment:
      SERVER_PORT: 8087
      LAB_DATASOURCE_URL: jdbc:oracle:thin:@oracle-xe:1521/XEPDB1
      LAB_DATASOURCE_USERNAME: ${LAB_DB_USERNAME:-lab}
      LAB_DATASOURCE_PASSWORD: ${LAB_DB_PASSWORD:?set LAB_DB_PASSWORD in .env}
      LAB_JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      CORE_SERVICE_BASE_URL: http://core-service:8082
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8087:8087"
    depends_on:
      oracle-xe:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure
    networks:
      - nova-net

  # ─────────────────────────────────────────────────────────
  # NotificationService (host:8088 → container:8088)
  # ─────────────────────────────────────────────────────────
  notification-service:
    build: ./NotificationService
    container_name: nova-notification
    environment:
      SERVER_PORT: 8088
      NOTIFICATION_DATASOURCE_URL: jdbc:oracle:thin:@oracle-xe:1521/XEPDB1
      NOTIFICATION_DATASOURCE_USERNAME: ${NOTIFICATION_DB_USERNAME:-notification}
      NOTIFICATION_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
      NOTIFICATION_JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "8088:8088"
    depends_on:
      oracle-xe:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure
    networks:
      - nova-net

  # ─────────────────────────────────────────────────────────
  # TenantService (host:8089 → container:8089)
  # ─────────────────────────────────────────────────────────
  tenant-service:
    build: ./TenantService
    container_name: nova-tenant
    environment:
      SERVER_PORT: 8089
      TENANT_DATASOURCE_URL: jdbc:oracle:thin:@oracle-xe:1521/XEPDB1
      TENANT_DATASOURCE_USERNAME: ${TENANT_DB_USERNAME:-tenant}
      TENANT_DATASOURCE_PASSWORD: ${TENANT_DB_PASSWORD:?set TENANT_DB_PASSWORD in .env}
      TENANT_JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8089:8089"
    depends_on:
      oracle-xe:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure
    networks:
      - nova-net

  # ─────────────────────────────────────────────────────────
  # SuperAdminService (host:8090 → container:8090)
  # ─────────────────────────────────────────────────────────
  super-admin-service:
    build: ./SuperAdminService
    container_name: nova-super-admin
    environment:
      SERVER_PORT: 8090
      SUPERADMIN_DATASOURCE_URL: jdbc:oracle:thin:@oracle-xe:1521/XEPDB1
      SUPERADMIN_DATASOURCE_USERNAME: ${SUPERADMIN_DB_USERNAME:-superadmin}
      SUPERADMIN_DATASOURCE_PASSWORD: ${SUPERADMIN_DB_PASSWORD:?set SUPERADMIN_DB_PASSWORD in .env}
      SUPERADMIN_JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      TENANT_SERVICE_BASE_URL: http://tenant-service:8089
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8090:8090"
    depends_on:
      oracle-xe:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure
    networks:
      - nova-net

  # ─────────────────────────────────────────────────────────
  # API Gateway (host:8080 → container:8080)
  # ────────────────────────────────────────────────────────
  api-gateway:
    build: ./ApiGateway
    container_name: nova-gateway
    environment:
      SERVER_PORT: 8080
      APP_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - core-service
      - clinical-service
      - inventory-service
      - billing-service
      - admin-service
      - lab-service
      - notification-service
      - tenant-service
      - super-admin-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: on-failure
    networks:
      - nova-net

  # ─────────────────────────────────────────────────────────
  # React Frontend (host:5373 → container:80)
  # ─────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: nova-frontend
    ports:
      - "5373:80"
    depends_on:
      - api-gateway
    networks:
      - nova-net

networks:
  nova-net:
    driver: bridge

volumes:
  oracle-data:
  rabbitmq-data:
