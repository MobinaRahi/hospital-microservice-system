# ============================================================
# TenantService — Test Configuration
# ============================================================

spring:
  application:
    name: tenant-service-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database: H2
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  cache:
    type: none

# ==================== SERVER ====================
server:
  port: 0

# ==================== JWT ====================
app:
  jwt:
    secret: test-secret-key-for-jwt-token-generation-minimum-256-bits-long-enough!!

# ==================== LOGGING ====================
logging:
  level:
    root: WARN
    hospital.tenantservice: DEBUG
